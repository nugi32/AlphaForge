[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-research-v2"
version = "0.2.0"
description = "Edge research v2: trade-outcome-first search for trading rules from MT5 indicator exports"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "tabulate>=0.9.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
analysis = ["scipy>=1.11.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["edge_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["."]
